name: CI

# master: the public mirror awun0105/P-087 receives develop as master and runs Actions there, because the organization
# repository's Actions are blocked by billing.
on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: requirements*.lock.txt

      - name: Install system tools used by the tests
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          pip install uv==0.9.4
          uv pip sync requirements.lock.txt requirements-dev.lock.txt --system

      - name: Lint with ruff
        run: ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/ scripts/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Check Integration Foundation readiness
        run: python -m scripts.check_foundation

      - name: Check TypeScript contract mirror
        run: python -m scripts.check_contract_mirror

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build:editor && npm run build
