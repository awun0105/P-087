# Dùng kèm khi `docker build` không tải được gói vì mạng bridge của Docker trên máy bạn không phân giải được tên miền
# (lỗi "Temporary failure in name resolution" lúc pip/npm). Chỉ đổi mạng lúc BUILD sang mạng của máy (Linux):
#
#   docker compose -f docker-compose.studio.yml -f docker-compose.studio.hostbuild.yml up --build
services:
  restore:
    build: { network: host }
  api:
    build: { network: host }
  web:
    build: { network: host }
